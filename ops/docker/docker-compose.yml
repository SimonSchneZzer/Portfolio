services:
  api:
    build:
      context: ../..
      dockerfile: ops/docker/api.Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      OLLAMA_BASE_URL: http://192.168.8.50:11434
      OLLAMA_MODEL: qwen2.5:3b
      ALLOWED_ORIGINS: https://ai.schnetzer.at
      KB_INDEX_PATH: /app/data/kb-index.json
      SYSTEM_PROMPT_PATH: /app/knowledge/system-prompt.md
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: ops/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_CHAT_API_URL: /api/chat
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
